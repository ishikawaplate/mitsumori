<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>見積もりシステム | 石川プレート</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif; background:#f4f6f8; color:#2d3748; font-size:15px; }
  .wrap { max-width:1000px; margin:0 auto; padding:20px 14px 60px; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  .brand { display:flex; align-items:center; gap:10px; }
  .logo { width:38px; height:38px; border-radius:10px; background:#0d9488; color:#fff; display:flex; align-items:center; justify-content:center; font-weight:bold; font-size:18px; }
  h1 { font-size:17px; }
  .sub { font-size:12px; color:#718096; }
  .btn { border:none; border-radius:8px; padding:9px 16px; font-size:14px; cursor:pointer; font-weight:600; }
  .btn-primary { background:#0d9488; color:#fff; }
  .btn-primary:hover { background:#0f766e; }
  .btn-ghost { background:#fff; color:#4a5568; border:1px solid #e2e8f0; }
  .btn-ghost:hover { background:#f7fafc; }
  .btn-sm { padding:5px 10px; font-size:12px; }
  .btn:disabled { background:#cbd5e0; cursor:not-allowed; }
  .card { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:20px; margin-bottom:14px; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:center; }
  input, select, textarea { width:100%; border:1px solid #cbd5e0; border-radius:8px; padding:9px 10px; font-size:14px; font-family:inherit; background:#fff; }
  input:focus, textarea:focus, select:focus { outline:none; border-color:#0d9488; }
  label { display:block; font-size:13px; font-weight:600; margin:12px 0 5px; color:#4a5568; }
  .pill { display:inline-block; font-size:11px; font-weight:600; padding:2px 9px; border-radius:99px; }
  .pill-open { background:#ccfbf1; color:#0f766e; }
  .pill-closed { background:#e2e8f0; color:#64748b; }
  .pill-over { background:#fee2e2; color:#dc2626; }
  .pill-urgent { background:#dc2626; color:#fff; }
  .pill-best { background:#0d9488; color:#fff; }
  .toast { position:fixed; bottom:24px; left:50%; transform:translateX(-50%); background:#1a202c; color:#fff; padding:11px 18px; border-radius:10px; font-size:13px; display:none; z-index:99; max-width:90%; }
  .loading { text-align:center; color:#a0aec0; padding:40px 0; }
  .err { color:#dc2626; font-size:13px; margin-top:8px; }
  .back { background:none; border:none; color:#718096; font-size:13px; cursor:pointer; padding:0; margin-bottom:12px; }
  .search-row { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .search-row input { flex:1; min-width:200px; }
  .tab { background:#fff; border:1px solid #e2e8f0; padding:8px 14px; border-radius:8px; font-size:13px; cursor:pointer; }
  .tab.on { background:#1a202c; color:#fff; border-color:#1a202c; }
  .supcheck { display:flex; align-items:center; gap:8px; border:1px solid #e2e8f0; border-radius:8px; padding:9px 12px; cursor:pointer; font-size:14px; user-select:none; }
  .supcheck.on { border-color:#0d9488; background:#f0fdfa; }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  @media(max-width:600px){ .grid2{grid-template-columns:1fr;} }

  /* 一覧カード：担当を右端に */
  .item { display:flex; align-items:center; gap:14px; background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:14px 16px; margin-bottom:10px; cursor:pointer; transition:.15s; }
  .item:hover { border-color:#0d9488; }
  .item-main { flex:1; min-width:0; }
  .item h3 { font-size:15px; margin-bottom:4px; }
  .meta { font-size:12px; color:#718096; display:flex; gap:12px; flex-wrap:wrap; }
  .tanto-box { flex-shrink:0; text-align:center; border-left:1px solid #e2e8f0; padding-left:14px; min-width:82px; }
  .tanto-label { font-size:10px; color:#a0aec0; letter-spacing:.05em; }
  .tanto-name { font-size:15px; font-weight:700; color:#0f766e; }

  /* テーブル */
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th { text-align:left; font-size:12px; color:#718096; padding:8px 10px; border-bottom:1px solid #e2e8f0; background:#f7fafc; }
  td { padding:9px 10px; border-bottom:1px solid #edf2f7; }
  .mtable input, .mtable select { padding:7px 8px; font-size:13px; }
  .mtable td { padding:5px 4px; }
  .m-del { background:none; border:none; color:#cbd5e0; cursor:pointer; font-size:16px; }
  .m-del:hover { color:#dc2626; }
  .m-total { text-align:right; font-size:15px; font-weight:700; color:#0f766e; margin-top:8px; }
  .itembox { border:1px solid #e2e8f0; border-radius:10px; padding:12px 14px; margin-bottom:10px; background:#fcfcfd; }
  .itembox h4 { font-size:14px; margin-bottom:2px; }
  .best-row { background:#f0fdfa; }
  .reqno { font-family:monospace; font-size:12px; color:#4a5568; background:#edf2f7; padding:2px 7px; border-radius:5px; }
  .pill-qa { background:#fef3c7; color:#b45309; }
  .pill-k1 { background:#dcfce7; color:#15803d; }
  .pill-k2 { background:#fef3c7; color:#b45309; }
  .pill-k3 { background:#e2e8f0; color:#64748b; }
  .pill-hac { background:#1a202c; color:#fff; }
  .row-ng { opacity:.55; }
  .row-hac { background:#eef2ff !important; }
  .sec-alt { margin-top:8px; padding-top:8px; border-top:1px dashed #e2e8f0; }
  .sec-label { font-size:11px; color:#b45309; font-weight:700; margin-bottom:4px; }
  .qabox { border:1px solid #e2e8f0; border-radius:10px; padding:12px 14px; margin-bottom:10px; }
  .qabox.pending { border-color:#fcd34d; background:#fffbeb; }
  .qa-q { font-size:14px; white-space:pre-wrap; }
  .qa-a { font-size:14px; white-space:pre-wrap; background:#f0fdfa; border-left:3px solid #0d9488; padding:8px 10px; border-radius:0 6px 6px 0; margin-top:8px; }
  .qa-head { font-size:11px; font-weight:700; letter-spacing:.05em; margin-bottom:4px; }
  .qa-head.q { color:#b45309; }
  .qa-head.a { color:#0f766e; }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">読み込み中...</div></div>
<div class="toast" id="toast"></div>

<script>
const GAS_URL = 'https://script.google.com/macros/s/AKfycbwvELfo5C-8cInDwsPvgDCYfwocHyEGjVj755iFSlMB-qpR1klsJryh0dqb1NJF2bXzWg/exec';
const UNITS = ['枚','本','個','式','セット','m','kg','-'];
const DUE_OPTIONS = [[0,'本日中（至急）'],[1,'翌日'],[2,'2日後'],[3,'3日後'],[7,'1週間']];
const VALID_OPTIONS = ['','2週間','1ヶ月','3ヶ月'];
const KUBUN_OPTIONS = ['ご依頼どおり','同等品','対応不可'];
const NOUNYU_OPTIONS = ['第一工場','第二工場','第三工場','事務所','直送（備考参照）'];

const $ = s => document.querySelector(s);
const app = $('#app');
let state = { pass:'', data:null, view:'list', currentReq:null, q:'', cat:'all', tanto:'all' };

function toast(m){ const t=$('#toast'); t.textContent=m; t.style.display='block'; setTimeout(()=>t.style.display='none',3200); }
function esc(s){ return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtDate(v){ if(!v) return ''; const s=String(v); return s.includes('T')?s.slice(0,10):s; }
function yen(n){ return '¥'+Number(n||0).toLocaleString('ja-JP'); }
function norm(v){ return String(v??'').trim(); }
function cssEsc(s){ return String(s).replace(/[^a-zA-Z0-9_-]/g,'_'); }

async function apiGet(p){ return (await fetch(GAS_URL+'?'+new URLSearchParams(p))).json(); }
async function apiPost(b){ return (await fetch(GAS_URL,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b)})).json(); }

const urlKey = new URLSearchParams(location.search).get('key');
const urlReq = new URLSearchParams(location.search).get('req');
const urlGenba = new URLSearchParams(location.search).get('genba');
if (urlKey) supplierInit(urlKey); else if (urlGenba) genbaInit(); else ordererInit();

/* ============ 発注側 ============ */
function ordererInit(){
  const saved = sessionStorage.getItem('aimi_pass');
  if(saved){ state.pass=saved; loadAllThenOpen(); } else renderLogin();
}
async function loadAllThenOpen(){
  app.innerHTML='<div class="loading">読み込み中...</div>';
  const r=await apiGet({action:'getAll',pass:state.pass});
  if(!r.ok){ sessionStorage.removeItem('aimi_pass'); renderLogin(r.error); return; }
  state.data=r;
  openInitialView();
}
function renderLogin(msg){
  app.innerHTML = `
    <header><div class="brand"><div class="logo">見</div><div><h1>見積もり管理</h1><div class="sub">石川プレート</div></div></div></header>
    <div class="card" style="max-width:400px;margin:40px auto;">
      <label>パスコード</label><input type="password" id="pw">
      ${msg?`<div class="err">${esc(msg)}</div>`:''}
      <div style="margin-top:14px;text-align:right;"><button class="btn btn-primary" onclick="tryLogin()">ログイン</button></div>
    </div>`;
  $('#pw').addEventListener('keydown',e=>{ if(e.key==='Enter') tryLogin(); });
}
async function tryLogin(){
  const pw=$('#pw').value.trim(); if(!pw) return;
  app.innerHTML='<div class="loading">確認中...</div>';
  const r=await apiGet({action:'getAll',pass:pw});
  if(!r.ok){ renderLogin(r.error); return; }
  state.pass=pw; sessionStorage.setItem('aimi_pass',pw); state.data=r;
  openInitialView();
}
async function loadAll(){
  app.innerHTML='<div class="loading">読み込み中...</div>';
  const r=await apiGet({action:'getAll',pass:state.pass});
  if(!r.ok){ sessionStorage.removeItem('aimi_pass'); renderLogin(r.error); return; }
  state.data=r;
  if(state.view==='detail'&&state.currentReq) renderDetail(state.currentReq); else renderList();
}
// URLで依頼が指定されていればその詳細を開く（初回のみ）
function openInitialView(){
  if(urlReq && !window._reqOpened){
    window._reqOpened=true;
    const hit=(state.data.requests||[]).find(r=>norm(r.req_id)===norm(urlReq));
    if(hit){ openDetail(hit.req_id); return; }
    toast('指定された依頼が見つかりませんでした');
  }
  renderList();
}
function genbaPendingCount(){
  return (state.data.requests||[]).filter(r=>norm(r.mode)==='genba'&&norm(r.status)==='pending_approval').length;
}
function headerHtml(showNew){
  const pend = genbaPendingCount();
  return `<header>
    <div class="brand"><div class="logo">見</div><div><h1>見積もり管理</h1><div class="sub">石川プレート 購買</div></div></div>
    ${showNew?`<div class="row" style="gap:8px;">
      <button class="btn btn-ghost" onclick="renderNyukaScan()">入荷消込</button>
      <button class="btn btn-ghost" onclick="renderGenbaApproval()">現場発注承認${pend?' <span class="pill pill-urgent">'+pend+'</span>':''}</button>
      <button class="btn btn-ghost" onclick="renderDirectOrder()">直接発注</button>
      <button class="btn btn-primary" onclick="renderNew()">＋ 見積依頼</button>
    </div>`:''}
  </header>`;
}

const D = {
  reqItems: rid => (state.data.iraiMeisai||[]).filter(m=>norm(m.req_id)===norm(rid)),
  quotes:   rid => (state.data.quotes||[]).filter(q=>norm(q.req_id)===norm(rid)),
  mei:      kid => (state.data.meisai||[]).filter(m=>norm(m.kaito_id)===norm(kid)),
  sup:      id  => (state.data.suppliers||[]).find(s=>norm(s.id)===norm(id)),
  qa:       rid => (state.data.qa||[]).filter(x=>norm(x.req_id)===norm(rid)),
  hac:      rid => (state.data.hacchu||[]).filter(x=>norm(x.req_id)===norm(rid))
};
function hacOf(rid, meiId){
  return (state.data.hacchu||[]).find(x=>norm(x.req_id)===norm(rid)&&norm(x.irai_meisai_id)===norm(meiId));
}
function kubunPill(k){
  const t=norm(k);
  if(t==='同等品') return '<span class="pill pill-k2">同等品</span>';
  if(t==='対応不可') return '<span class="pill pill-k3">対応不可</span>';
  if(t) return '<span class="pill pill-k1">依頼どおり</span>';
  return '';
}
// 未回答の質問件数
function unansweredQa(rid){ return D.qa(rid).filter(x=>!norm(x.answer)).length; }
function bestOf(rid){
  const qs=D.quotes(rid); if(!qs.length) return null;
  return qs.reduce((m,c)=>Number(c.unit_price)<Number(m.unit_price)?c:m);
}
// 今日の日付（ブラウザのローカルタイムゾーン基準。toISOString()はUTC基準になり
// 日本時間の深夜〜朝9時前は前日の日付になってしまうため使わないこと）
function todayLocalStr(){
  const d=new Date();
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function isOverdue(r){ return norm(r.status)==='open' && fmtDate(r.due_at) < todayLocalStr(); }

// 依頼に登場する担当者名の一覧（重複なし）
function tantoList(){
  const names=(state.data.requests||[]).map(r=>norm(r.tanto)).filter(Boolean);
  return [...new Set(names)];
}

// 検索バー・フィルタ行（再描画しない）
function renderList(){
  state.view='list';
  app.innerHTML = headerHtml(true) + `
    <div class="search-row">
      <input id="q" placeholder="品名・依頼番号・備考で検索" value="${esc(state.q)}">
      <button class="tab ${state.cat==='all'?'on':''}" id="cf-all" onclick="setCat('all')">すべて</button>
      <button class="tab ${state.cat==='resin'?'on':''}" id="cf-resin" onclick="setCat('resin')">樹脂材</button>
      <button class="tab ${state.cat==='metal'?'on':''}" id="cf-metal" onclick="setCat('metal')">金属材</button>
    </div>
    <div class="search-row" id="tanto-row"></div>
    <div id="list"></div>`;

  renderTantoRow();
  renderListBody();

  const el=$('#q');
  // 変換確定後・通常入力ともに拾うが、一覧だけを描き直す（入力欄は触らない）
  el.addEventListener('input',()=>{ state.q=el.value; renderListBody(); });
}

function renderTantoRow(){
  const names=tantoList();
  if(!names.length){ $('#tanto-row').innerHTML=''; return; }
  $('#tanto-row').innerHTML =
    `<span class="sub" style="align-self:center;margin-right:2px;">担当</span>` +
    `<button class="tab ${state.tanto==='all'?'on':''}" onclick="setTanto('all')">すべて</button>` +
    names.map(n=>`<button class="tab ${state.tanto===n?'on':''}" onclick="setTanto('${esc(n)}')">${esc(n)}</button>`).join('');
}

function renderListBody(){
  const reqs=(state.data.requests||[])
    .filter(r=> state.cat==='all'||norm(r.category)===state.cat)
    .filter(r=> state.tanto==='all'||norm(r.tanto)===state.tanto)
    .filter(r=>{
      if(!state.q) return true;
      const items=D.reqItems(r.req_id).map(m=>m.hinmei+' '+m.shiyou).join(' ');
      return (r.title+' '+items+' '+r.note+' '+r.req_id+' '+(r.tanto||'')).toLowerCase().includes(state.q.toLowerCase());
    }).slice().reverse();

  $('#list').innerHTML = (reqs.length?'':'<div class="loading">該当する依頼はありません</div>') +
    reqs.map(r=>{
      const qs=D.quotes(r.req_id), total=norm(r.supplier_ids).split(',').filter(Boolean).length;
      const best=bestOf(r.req_id), over=isOverdue(r), items=D.reqItems(r.req_id);
      return `<div class="item" onclick="openDetail('${esc(r.req_id)}')">
        <div class="item-main">
          <h3>${esc(r.title)||'（無題）'}
            ${norm(r.mode)==='genba'?'<span class="pill" style="background:#fef3c7;color:#b45309;">現場発注 承認待ち</span>':''}
            ${norm(r.mode)==='hacchu'?'<span class="pill pill-hac">直接発注</span>':(norm(r.mode)==='genba'?'':(norm(r.status)==='closed'?'<span class="pill pill-closed">締切済</span>':over?'<span class="pill pill-over">期限超過</span>':'<span class="pill pill-open">回答待ち</span>'))}
            ${norm(r.mode)==='hacchu'&&norm(r.source)==='genba'?'<span class="pill" style="background:#e0e7ff;color:#4338ca;">現場発注</span>':''}
            ${unansweredQa(r.req_id)?`<span class="pill pill-qa">質問${unansweredQa(r.req_id)}件</span>`:''}
            ${(norm(r.mode)!=='hacchu'&&norm(r.mode)!=='genba'&&D.hac(r.req_id).length)?`<span class="pill pill-hac">${norm(r.hacchu_info)?'発注確定':'発注検討中'}</span>`:''}
          </h3>
          <div class="meta">
            <span>${esc(r.req_id)}</span>
            <span>${norm(r.category)==='resin'?'樹脂材':'金属材'}</span>
            <span>品目 ${items.length}件</span>
            ${norm(r.mode)==='hacchu'?`<span>発注先 ${esc(D.sup(norm(r.supplier_ids))?.name||'')}</span>`:`<span>回答 ${qs.length}/${total} 社</span>`}
            <span>期限 ${fmtDate(r.due_at)}</span>
            ${best?`<span style="color:#0f766e;">最安計 ${yen(best.unit_price)} / ${esc(D.sup(best.supplier_id)?.name||'')}</span>`:''}
          </div>
        </div>
        ${r.tanto?`<div class="tanto-box"><div class="tanto-label">担当</div><div class="tanto-name">${esc(r.tanto)}</div></div>`:''}
      </div>`;
    }).join('');
}

function setCat(c){
  state.cat=c;
  ['all','resin','metal'].forEach(k=>$('#cf-'+k).classList.toggle('on',k===c));
  renderListBody();
}
function setTanto(n){ state.tanto=n; renderTantoRow(); renderListBody(); }

/* ---------- 新規依頼（複数品目） ---------- */
function renderNew(){
  state.view='new';
  window._items=[{hinmei:'',shiyou:'',qty:1,unit:'枚'}];
  window._sel=[]; window._newCat='resin';
  app.innerHTML = headerHtml(false) + `
    <button class="back" onclick="renderList()">← 一覧に戻る</button>
    <div class="card">
      <h2 style="font-size:16px;margin-bottom:6px;">見積もり依頼を作成</h2>
      <label>材料区分</label>
      <div class="row">
        <button class="tab on" id="cat-resin" onclick="newCat('resin')">樹脂材</button>
        <button class="tab" id="cat-metal" onclick="newCat('metal')">金属材</button>
      </div>
      <div class="grid2">
        <div><label>件名</label><input id="f-title" placeholder="例: PET・塩ビ板 各種"></div>
        <div><label>担当者名</label><input id="f-tanto" placeholder="例: 齋藤"></div>
      </div>
      <label>回答期限</label>
      <select id="f-due">${DUE_OPTIONS.map(([v,l])=>`<option value="${v}" ${v===2?'selected':''}>${l}</option>`).join('')}</select>
      <label>見積もり品目</label>
      <div id="items-box"></div>
      <div style="margin-top:6px;"><button class="btn btn-ghost btn-sm" onclick="addItem()">＋ 品目を追加</button>
        <span class="sub" style="margin-left:8px;">材質・寸法違いもまとめて依頼できます</span></div>
      <label>備考（任意）</label><textarea id="f-note" rows="2" placeholder="納期の希望、分納可否など（※この内容は仕入れ先にも表示されます）"></textarea>
      <label>社内備考（事務所控え・仕入れ先には表示されません）</label>
      <textarea id="f-bikou" rows="2" placeholder="例: 第二工場・○○さん使用分 / 客先△△向け など" style="background:#fffef5;"></textarea>
      <label>送信先（見積もりを取りたい先を選択）</label>
      <div class="grid2" id="sup-list"></div>
      <div style="margin-top:18px;text-align:right;">
        <button class="btn btn-ghost" onclick="renderList()">キャンセル</button>
        <button class="btn btn-primary" id="send-btn" onclick="submitNew()">依頼を送信</button>
      </div>
    </div>`;
  renderItems(); renderSupChecks();
}
function newCat(c){
  window._newCat=c;
  $('#cat-resin').classList.toggle('on',c==='resin');
  $('#cat-metal').classList.toggle('on',c==='metal');
  renderSupChecks();
}
function renderItems(){
  $('#items-box').innerHTML = `<table class="mtable">
    <tr><th style="width:32%;">品名</th><th style="width:38%;">仕様</th><th>数量</th><th>単位</th><th></th></tr>
    ${window._items.map((it,i)=>`<tr>
      <td><input value="${esc(it.hinmei)}" placeholder="例: PET板" oninput="upItem(${i},'hinmei',this.value)"></td>
      <td><input value="${esc(it.shiyou)}" placeholder="例: t2.0 1000×2000 透明" oninput="upItem(${i},'shiyou',this.value)"></td>
      <td><input type="number" value="${esc(it.qty)}" style="width:62px;" oninput="upItem(${i},'qty',this.value)"></td>
      <td><select onchange="upItem(${i},'unit',this.value)">${UNITS.map(u=>`<option ${u===it.unit?'selected':''}>${u}</option>`).join('')}</select></td>
      <td>${window._items.length>1?`<button class="m-del" onclick="delItem(${i})">×</button>`:''}</td>
    </tr>`).join('')}
  </table>`;
}

function renderNyukaScan(){

  box.addEventListener('keydown', async e=>{

      <h2 style="font-size:16px;margin-bottom:2px;">材料を発注する</h2>
      <div class="sub" style="margin-bottom:6px;">送信すると事務所の承認後に仕入れ先へ発注されます（プールされます）。</div>
      <label>材料区分</label>
      <div class="row">
        <button class="tab on" id="gcat-resin" onclick="gCat('resin')">樹脂材</button>
        <button class="tab" id="gcat-metal" onclick="gCat('metal')">金属材</button>
      </div>
      <div class="grid2">
        <div><label>件名（任意）</label><input id="g-title" placeholder="例: アクリル押出板"></div>
        <div><label>担当者名</label><input id="g-tanto" placeholder="例: 山口"></div>
      </div>
      <label>発注先（1社）</label>
      <div id="g-sup-list" class="grid2"></div>
      <label style="margin-top:14px;">発注品目</label>
      <div id="g-items-box"></div>
      <div style="margin-top:6px;"><button class="btn btn-ghost btn-sm" onclick="addGItem()">＋ 品目を追加</button></div>
      <div class="grid2" style="margin-top:8px;">
        <div><label>納入先</label><select id="g-nou">${NOUNYU_OPTIONS.map(o=>`<option>${o}</option>`).join('')}</select></div>
        <div><label>希望納期</label>
          <select id="g-mode" onchange="gToggleNouki()">
            <option value="date">日付を指定する</option>
            <option value="normal">通常納期（おまかせ）</option>
          </select></div>
      </div>
      <div id="g-date-wrap" style="margin-top:8px;"><label>希望納入日</label><input type="date" id="g-date" style="max-width:200px;"></div>
      <div style="margin-top:18px;text-align:right;">
        <button class="btn btn-primary" id="gsend-btn" onclick="submitGenba()">この内容で発注申請する</button>
      </div>
    </div>
    <h2 style="font-size:15px;margin:20px 0 10px;">自分の申請状況</h2>
    <div id="g-mine"></div>
    <h2 style="font-size:15px;margin:20px 0 10px;">入荷確認</h2>
    <div class="card">
      <input id="g-search" placeholder="品名・仕入れ先で検索" oninput="renderGArrivals()">
    </div>
    <div id="g-arrivals"></div>`;
  gCat('resin'); renderGItems(); renderGMine(); renderGArrivals();
}
function gCat(c){
  window._gcat=c; window._gsup='';
  $('#gcat-resin').classList.toggle('on',c==='resin');
  $('#gcat-metal').classList.toggle('on',c==='metal');
  const sups=(state.data.suppliers||[]).filter(s=>norm(s.category).toLowerCase()===c);
  $('#g-sup-list').innerHTML = sups.length
    ? sups.map(s=>`<div class="supcheck" id="gsc-${s.id}" onclick="gPickSup('${s.id}')"><span>○</span><span>${esc(s.name)}</span></div>`).join('')
    : '<div class="sub" style="grid-column:1/-1;">この区分の仕入れ先が見つかりません。</div>';
}
function gPickSup(id){
  window._gsup=id;
  (state.data.suppliers||[]).forEach(s=>{
    const el=$('#gsc-'+s.id); if(!el) return;
    const on=s.id===id;
    el.classList.toggle('on',on);
    el.querySelector('span').textContent = on?'●':'○';
  });
}
function renderGItems(){
  $('#g-items-box').innerHTML = `<div style="overflow-x:auto;"><table class="mtable">
    <tr><th>メーカー</th><th>材質</th><th>色</th><th>板厚</th><th>サイズ(mm)</th><th>数量</th><th>単位</th><th></th></tr>
    ${window._gitems.map((it,i)=>`<tr>
      <td><input value="${esc(it.maker)}" style="width:80px;" oninput="upGItem(${i},'maker',this.value)"></td>
      <td><input value="${esc(it.zaishitsu)}" placeholder="アクリル押出板" style="width:110px;" oninput="upGItem(${i},'zaishitsu',this.value)"></td>
      <td><input value="${esc(it.iro)}" placeholder="トーメー" style="width:70px;" oninput="upGItem(${i},'iro',this.value)"></td>
      <td><input value="${esc(it.itaatsu)}" placeholder="3t" style="width:54px;" oninput="upGItem(${i},'itaatsu',this.value)"></td>
      <td><input value="${esc(it.size)}" placeholder="1380×1830" style="width:110px;" oninput="upGItem(${i},'size',this.value)"></td>
      <td><input type="number" value="${esc(it.qty)}" style="width:54px;" oninput="upGItem(${i},'qty',this.value)"></td>
      <td><select onchange="upGItem(${i},'unit',this.value)">${UNITS.map(u=>`<option ${u===it.unit?'selected':''}>${u}</option>`).join('')}</select></td>
      <td>${window._gitems.length>1?`<button class="m-del" onclick="delGItem(${i})">×</button>`:''}</td>
    </tr>`).join('')}
  </table></div>`;
}
function upGItem(i,f,v){ window._gitems[i][f]=v; }
function addGItem(){ window._gitems.push({maker:'',zaishitsu:'',iro:'',itaatsu:'',size:'',qty:1,unit:'枚'}); renderGItems(); }
function delGItem(i){ window._gitems.splice(i,1); renderGItems(); }
function gToggleNouki(){
  const m=$('#g-mode').value;
  $('#g-date-wrap').style.display = m==='normal'?'none':'block';
}
async function submitGenba(){
  if(!window._gsup){ toast('発注先を1社選んでください'); return; }
  const items=window._gitems.filter(it=>it.maker||it.zaishitsu||it.size||it.iro);
  if(!items.length){ toast('品目を1行以上入力してください'); return; }
  const mode=$('#g-mode').value;
  let nouki='通常納期';
  if(mode==='date'){
    const d=$('#g-date').value;
    if(!d){ toast('希望納入日を入力してください（通常納期の場合はプルダウンで切替）'); return; }
    nouki=d;
  }
  const nou=$('#g-nou').value;
  if(!confirm('この内容で発注申請しますか？\n\n発注先: '+(D.sup(window._gsup)?.name||'')+'\n納入先: '+nou+'\n希望納期: '+nouki+'\n\n事務所の承認後に発注されます。')) return;
  const b=$('#gsend-btn'); b.disabled=true; b.textContent='送信中...';
  const r=await apiPost({action:'addGenbaOrder',pass:state.pass,category:window._gcat,
    title:$('#g-title').value.trim(), tanto:$('#g-tanto').value.trim(),
    supplierId:window._gsup, items, nounyusaki:nou, nouki});
  if(!r.ok){ toast('エラー: '+r.error); b.disabled=false; b.textContent='この内容で発注申請する'; return; }
  toast('発注申請を送信しました（承認待ち）');
  await reloadGenba();
  renderGenbaHome();
}
function renderGMine(){
  const list=(state.data.requests||[]).filter(r=>norm(r.source)==='genba').slice().reverse().slice(0,15);
  const el=$('#g-mine');
  if(!list.length){ el.innerHTML='<div class="card sub">まだ申請はありません。</div>'; return; }
  el.innerHTML = list.map(r=>{
    const sup=D.sup(norm(r.supplier_ids));
    let pill;
    if(norm(r.status)==='rejected') pill=`<span class="pill pill-over">却下されました${r.reject_reason?'：'+esc(r.reject_reason):''}</span>`;
    else if(norm(r.status)==='pending_approval') pill='<span class="pill pill-qa">承認待ち</span>';
    else pill='<span class="pill pill-hac">発注済み</span>';
    return `<div class="card">
      <div class="row" style="justify-content:space-between;">
        <div>
          <div style="font-weight:700;">${esc(r.title)||'（無題）'} ${pill}</div>
          <div class="meta" style="margin-top:4px;"><span class="reqno">${esc(r.req_id)}</span><span>発注先 ${esc(sup?.name||'')}</span><span>${fmtDate(r.created_at)}</span></div>
        </div>
      </div>
    </div>`;
  }).join('');
}
function renderGArrivals(){
  const q=norm($('#g-search')?.value||'').toLowerCase();
  const list=(state.data.hacchu||[]).filter(h=>norm(h.nyuka_status)==='入荷済み')
    .filter(h=>!q || (norm(h.item_name)+' '+esc(D.sup(h.supplier_id)?.name||'')).toLowerCase().includes(q))
    .slice().reverse().slice(0,30);
  const el=$('#g-arrivals');
  if(!list.length){ el.innerHTML='<div class="card sub">該当する入荷はありません。</div>'; return; }
  el.innerHTML = list.map(h=>`<div class="card" style="background:#f0fdfa;">
    <div style="font-weight:700;">${esc(h.item_name)} ${esc(h.qty)}${esc(h.unit)}</div>
    <div class="meta" style="margin-top:4px;"><span>${esc(D.sup(h.supplier_id)?.name||'')}</span><span class="reqno">${esc(h.req_id)}</span><span>入荷 ${esc(h.nyuka_at)}</span></div>
  </div>`).join('');
}

function renderDetail(reqId){
  state.view='detail';
  const req=(state.data.requests||[]).find(r=>norm(r.req_id)===norm(reqId));
  if(!req){ renderList(); return; }
  if(norm(req.mode)==='hacchu'){ renderDirectDetail(req); return; }
  if(norm(req.mode)==='genba'){ renderGenbaDetail(req); return; }
  const supIds=norm(req.supplier_ids).split(',').map(x=>x.trim()).filter(Boolean);
  const items=D.reqItems(reqId), quotes=D.quotes(reqId), over=isOverdue(req);

  // 品目ごとの比較ブロック
  const itemBlocks = items.map(it=>{
    const rows = quotes.map(q=>{
      const m = D.mei(q.kaito_id).find(x=>norm(x.irai_meisai_id)===norm(it.irai_meisai_id));
      if(!m) return null;
      return { sup:D.sup(q.supplier_id), m, q };
    }).filter(Boolean);

    const ok   = rows.filter(r=>norm(r.m.kubun)!=='同等品' && norm(r.m.kubun)!=='対応不可');
    const alt  = rows.filter(r=>norm(r.m.kubun)==='同等品');
    const ng   = rows.filter(r=>norm(r.m.kubun)==='対応不可');
    const minOk  = ok.length  ? Math.min(...ok.map(r=>Number(r.m.unit_price)))  : null;
    const minAlt = alt.length ? Math.min(...alt.map(r=>Number(r.m.unit_price))) : null;
    const hac = hacOf(reqId, it.irai_meisai_id);

    const line = (r, min, tag) => {
      const isMin = Number(r.m.unit_price)===min;
      const isHac = hac && norm(hac.supplier_id)===norm(r.sup?.id);
      return `<tr class="${isHac?'row-hac':(isMin&&tag==='ok'?'best-row':'')}">
        <td>${esc(r.sup?.name||'')} ${isMin?`<span class="pill pill-best">${tag==='ok'?'最安':'同等品最安'}</span>`:''}${isHac?'<span class="pill pill-hac">発注</span>':''}${norm(r.q&&r.q.note)?`<div style="font-size:11px;color:#94a3b8;margin-top:2px;white-space:pre-wrap;">${esc(r.q.note)}</div>`:''}</td>
        <td class="sub">${esc(norm(r.m.item_name) || (norm(r.m.kubun)!=='同等品'&&norm(r.m.kubun)!=='対応不可' ? (it.hinmei+(norm(it.shiyou)?' '+it.shiyou:'')) : ''))} ${kubunPill(r.m.kubun)}</td>
        <td><b>${yen(r.m.unit_price)}</b></td>
        <td>${esc(r.m.qty)}${esc(r.m.unit)}</td>
        <td>${yen(Number(r.m.qty)*Number(r.m.unit_price))}</td>
        <td>${norm(r.m.lead_days)?esc(r.m.lead_days)+'日':'—'}</td>
        <td>${norm(req.hacchu_info) ? '' : (isHac
          ? `<button class="btn btn-ghost btn-sm" onclick="delHac('${esc(hac.hacchu_id)}','${esc(reqId)}')">取消</button>`
          : `<button class="btn btn-ghost btn-sm" onclick="adoptHac('${esc(reqId)}','${esc(it.irai_meisai_id)}','${esc(r.sup?.id)}','${esc(r.m.item_name)}',${Number(r.m.qty)||1},'${esc(r.m.unit)}',${Number(r.m.unit_price)||0})">採用</button>`)}</td>
      </tr>`;
    };
    const thead = `<tr><th>仕入れ先</th><th>提案品名</th><th>単価</th><th>数量</th><th>金額</th><th>納期</th><th></th></tr>`;

    return `<div class="itembox">
      <h4>${esc(it.hinmei)} <span class="sub">${esc(it.shiyou)}</span>
        ${hac?`<span class="pill pill-hac">発注済 ${esc(D.sup(hac.supplier_id)?.name||'')}</span>`:''}</h4>
      <div class="sub" style="margin-bottom:6px;">数量 ${esc(it.qty)}${esc(it.unit)}</div>
      ${ok.length?`<table>${thead}${ok.map(r=>line(r,minOk,'ok')).join('')}</table>`:''}
      ${alt.length?`<div class="sec-alt"><div class="sec-label">同等品でのご提案</div>
        <table>${thead}${alt.map(r=>line(r,minAlt,'alt')).join('')}</table></div>`:''}
      ${ng.length?`<div class="sec-alt"><div class="sec-label" style="color:#64748b;">対応不可</div>
        <div class="sub row-ng">${ng.map(r=>esc(r.sup?.name||'')+(norm(r.m.item_name)?'（'+esc(r.m.item_name)+'）':'')).join(' / ')}</div></div>`:''}
      ${rows.length?'':'<div class="sub">まだ回答がありません</div>'}
    </div>`;
  }).join('');

  // 各社の追加提案品目（依頼になかった品目。irai_meisai_id が空）
  const answeredSups = supIds.filter(sid=>quotes.some(q=>norm(q.supplier_id)===sid));
  const extraBlocks = answeredSups.map(sid=>{
    const sup=D.sup(sid); const q=quotes.find(x=>norm(x.supplier_id)===sid);
    const ex = q ? D.mei(q.kaito_id).filter(m=>!norm(m.irai_meisai_id)) : [];
    if(!ex.length) return '';
    return `<div style="margin-bottom:8px;">
      <div style="font-size:13px;font-weight:600;margin-bottom:4px;">${esc(sup?.name||'')}</div>
      <table>
        <tr><th>品名</th><th>単価</th><th>数量</th><th>金額</th><th>納期</th><th></th></tr>
        ${ex.map(m=>{
          const hac=hacOf(reqId, m.meisai_id); // 追加品目は meisai_id をキーに採用
          const isHac=!!hac;
          return `<tr class="${isHac?'row-hac':''}">
            <td>${esc(m.item_name)} ${isHac?'<span class="pill pill-hac">発注</span>':''}</td>
            <td><b>${yen(m.unit_price)}</b></td>
            <td>${esc(m.qty)}${esc(m.unit)}</td>
            <td>${yen(Number(m.qty)*Number(m.unit_price))}</td>
            <td>${norm(m.lead_days)?esc(m.lead_days)+'日':'—'}</td>
            <td>${norm(req.hacchu_info)?'':(isHac
              ? `<button class="btn btn-ghost btn-sm" onclick="delHac('${esc(hac.hacchu_id)}','${esc(reqId)}')">取消</button>`
              : `<button class="btn btn-ghost btn-sm" onclick="adoptHac('${esc(reqId)}','${esc(m.meisai_id)}','${esc(sid)}','${esc(m.item_name)}',${Number(m.qty)||1},'${esc(m.unit)}',${Number(m.unit_price)||0})">採用</button>`)}</td>
          </tr>`;
        }).join('')}
      </table>
    </div>`;
  }).filter(Boolean).join('');
  const extraHtml = extraBlocks
    ? `<h3 style="font-size:14px;margin:16px 0 8px;">各社の追加提案品目</h3>
       <div class="itembox">${extraBlocks}</div>` : '';

  // 補足情報（有効期限・コメント）
  const infoRows = answeredSups.map(sid=>{
    const sup=D.sup(sid); const q=quotes.find(x=>norm(x.supplier_id)===sid);
    const bits=[];
    if(q&&norm(q.valid_until)) bits.push('有効期限 '+esc(q.valid_until));
    if(!bits.length) return '';
    return `<div style="font-size:12px;color:#4a5568;margin-bottom:4px;"><b>${esc(sup?.name||'')}</b> ・ ${bits.join(' ・ ')}</div>`;
  }).filter(Boolean).join('');
  const infoHtml = infoRows ? `<div class="itembox" style="background:#fcfcfd;">${infoRows}</div>` : '';

  // 未回答の仕入れ先（督促用）
  const pending = supIds.filter(sid=>!quotes.some(q=>norm(q.supplier_id)===sid));
  const pendingHtml = (norm(req.status)==='open' && pending.length) ? `
    <div class="itembox" style="background:#fffbeb;border-color:#fcd34d;">
      <div class="sec-label" style="color:#b45309;margin-bottom:6px;">未回答の仕入れ先（${pending.length}社）</div>
      <div class="row">
        ${pending.map(sid=>{
          const sup=D.sup(sid); if(!sup) return '';
          return `<span class="supcheck" style="cursor:default;">${esc(sup.name)}
            <button class="btn btn-ghost btn-sm" style="margin-left:6px;" onclick="remind('${esc(req.req_id)}','${sid}')">督促</button></span>`;
        }).join('')}
      </div>
    </div>` : '';

  app.innerHTML = headerHtml(false) + `
    <button class="back" onclick="renderList()">← 一覧に戻る</button>
    <div class="card">
      <div class="row" style="justify-content:space-between;align-items:flex-start;">
        <div>
          <h2 style="font-size:16px;">${esc(req.title)}
            ${norm(req.status)==='closed'?'<span class="pill pill-closed">締切済</span>':over?'<span class="pill pill-over">期限超過</span>':'<span class="pill pill-open">回答待ち</span>'}
          </h2>
          <div class="meta" style="margin-top:6px;">
            <span class="reqno">${esc(req.req_id)}</span>
            <span>依頼日 ${fmtDate(req.created_at)}</span><span>期限 ${fmtDate(req.due_at)}</span>
          </div>
          ${req.note?`<div class="meta" style="margin-top:4px;white-space:pre-wrap;">備考: ${esc(req.note)}</div>`:''}
          ${norm(req.shanai_bikou)?`<div style="margin-top:6px;font-size:12px;background:#fffbeb;border:1px solid #fde68a;border-radius:6px;padding:6px 10px;color:#92400e;">社内備考（事務所控え）: ${esc(req.shanai_bikou)}</div>`:''}
        </div>
        <div class="row" style="gap:10px;">
          ${req.tanto?`<div class="tanto-box" style="border:none;"><div class="tanto-label">担当</div><div class="tanto-name">${esc(req.tanto)}</div></div>`:''}
          ${norm(req.status)==='open'?`<button class="btn btn-ghost btn-sm" onclick="closeReq('${esc(req.req_id)}')">締め切る</button>`:''}
        </div>
      </div>
      ${pendingHtml}
      <h3 style="font-size:14px;margin:16px 0 8px;">品目ごとの比較</h3>
      ${itemBlocks||'<div class="sub">品目がありません</div>'}
      ${extraHtml}
      ${infoHtml}
      <h3 style="font-size:14px;margin:20px 0 8px;">質疑応答 ${unansweredQa(reqId)?`<span class="pill pill-qa">未回答 ${unansweredQa(reqId)}件</span>`:''}</h3>
      ${renderQaOrderer(reqId)}
      ${renderHacchu(reqId)}
    </div>`;
}

function renderHacchu(reqId){
  const list=D.hac(reqId);
  if(!list.length) return '';
  const req=(state.data.requests||[]).find(r=>norm(r.req_id)===norm(reqId));
  const total=list.reduce((s,x)=>s+Number(x.amount||0),0);
  const confirmed=norm(req&&req.hacchu_info);
  // 発注先の社数
  const supIds=[...new Set(list.map(x=>norm(x.supplier_id)))];

  return `<h3 style="font-size:14px;margin:20px 0 8px;">発注内容
      ${confirmed?'<span class="pill pill-hac">確定済</span>':''}</h3>
    <div style="overflow-x:auto;"><table>
      <tr><th>品目</th><th>発注先</th><th>品名</th><th>数量</th><th>単価</th><th>金額</th>${confirmed?'<th>納入予定日</th>':''}</tr>
      ${list.map(x=>{
        const it=(state.data.iraiMeisai||[]).find(m=>norm(m.irai_meisai_id)===norm(x.irai_meisai_id));
        const hinmei = it ? it.hinmei : '（追加品目）';
        const shiyou = it ? it.shiyou : '';
        return `<tr>
          <td>${esc(hinmei)}<br><span class="sub">${esc(shiyou)}</span></td>
          <td><b>${esc(D.sup(x.supplier_id)?.name||'')}</b></td>
          <td class="sub">${esc(x.item_name)}</td>
          <td>${confirmed
            ? `${esc(x.qty)}${esc(x.unit)}`
            : `<input type="number" min="0" step="1" value="${esc(x.qty)}" style="width:64px;" onchange="updateHacQty('${esc(x.hacchu_id)}',this.value,'${esc(reqId)}')">${esc(x.unit)}`}</td>
          <td>${yen(x.unit_price)}</td>
          <td><b>${yen(x.amount)}</b></td>
          ${confirmed?`<td>${norm(x.nounyu_yotei)?esc(fmtDate(x.nounyu_yotei)):'<span class="sub">未登録</span>'}</td>`:''}
        </tr>`;
      }).join('')}
    </table></div>
    ${confirmed?'':'<div class="sub" style="margin-top:4px;">数量は入力欄を直接書き換えると変更できます（発注確定前のみ）。</div>'}
    <div class="m-total">発注合計 ${yen(total)}</div>
    ${confirmed
      ? `<div class="best-note">${esc(req.hacchu_info)}<br>${supIds.length}社へ注文書を送信済みです。納入予定日は仕入れ先の登録で反映されます。</div>
         <div style="margin-top:10px;text-align:right;">
           <button class="btn btn-ghost btn-sm" onclick="printOrderReceipt('${esc(reqId)}')">🖨 控えを印刷する</button>
         </div>`
      : `<div class="itembox" style="margin-top:10px;">
          <div class="sub" style="margin-bottom:8px;">注文書を送信する前に、納入先と希望納期をご指定ください。</div>
          <div class="grid2">
            <div><label>納入先</label>
              <select id="h-nou">${NOUNYU_OPTIONS.map(o=>`<option>${o}</option>`).join('')}</select></div>
            <div><label>希望納期</label>

async function confirmHac(reqId, supCount, itemCount){
  const nou=document.getElementById('h-nou').value;
  const mode=document.getElementById('h-mode').value;
  let nouki;
  if(mode==='normal'){ nouki='通常納期'; }
  else {
    const date=document.getElementById('h-date').value;
    if(!date){ toast('希望納入日を入力してください（通常納期の場合はプルダウンで切替）'); return; }
    nouki=date;
  }
  if(!confirm(`${itemCount}品目・${supCount}社へ注文書メールを送信します。\n\n納入先: ${nou}\n希望納期: ${nouki}\n\n送信後は取り消せません。よろしいですか？`)) return;
  const bikou=document.getElementById('h-bikou').value.trim();
  const r=await apiPost({action:'confirmHacchu',pass:state.pass,req_id:reqId,nounyusaki:nou,nouki:nouki,bikou:bikou});
  if(!r.ok){ toast('エラー: '+r.error); return; }
  toast(r.sent+'社へ注文書を送信しました');
  await loadAll();
}

function printOrderReceipt(reqId){
  const req=(state.data.requests||[]).find(r=>norm(r.req_id)===norm(reqId));
  if(!req){ toast('発注情報が見つかりません'); return; }
  const hac=D.hac(reqId);
  const items=D.reqItems(reqId);
  const sup=D.sup(norm(req.supplier_ids));
  const total=hac.reduce((s,x)=>s+Number(x.amount||0),0);
  const supNames=[...new Set(hac.map(x=>D.sup(x.supplier_id)?.name).filter(Boolean))];
  // 品名・仕様は「依頼明細」（hinmei/shiyou）を優先。直接発注/現場発注/見積り経由のどの発注方式でも
  // この2項目は必ず入っているため、これで統一して表示する（メーカー等の細目は仕様欄にまとめて入っている）。
  const rows = hac.map(x=>{
    const it=items.find(m=>norm(m.irai_meisai_id)===norm(x.irai_meisai_id));
    const hinmei = (it && norm(it.hinmei)) || norm(x.item_name) || '（追加品目）';
    const shiyou = it ? norm(it.shiyou) : '';
    return `<tr><td>${esc(hinmei)}</td><td class="sub">${esc(shiyou)}</td>
      <td>${esc(x.qty)}${esc(x.unit)}</td><td>${yen(x.unit_price)}</td><td>${yen(x.amount)}</td>
      <td>${esc(D.sup(x.supplier_id)?.name||sup?.name||'')}</td></tr>`;
  }).join('');
  const w=window.open('','_blank');
  if(!w){ toast('ポップアップがブロックされました。ブラウザの設定をご確認ください。'); return; }
  w.document.write(`<html><head><title>発注控え ${esc(reqId)}</title><style>
    body{font-family:sans-serif;padding:24px;color:#111;}
    h1{font-size:18px;margin-bottom:6px;}
    table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px;}
    th,td{border:1px solid #999;padding:5px 8px;text-align:left;}
    th{background:#eee;}
    .sub{color:#555;}
    .meta{font-size:12px;color:#444;margin:2px 0;white-space:pre-wrap;}
    .total{text-align:right;font-weight:bold;margin-top:10px;font-size:14px;}
  </style></head><body>
    <h1>発 注 控 え</h1>
    <div class="meta">発注番号: ${esc(reqId)}　件名: ${esc(req.title)||''}</div>
    <div class="meta">発注先: ${esc(supNames.join('、')||sup?.name||'')}　発注日: ${esc(fmtDate(req.created_at))}</div>
    ${req.tanto?`<div class="meta">担当: ${esc(req.tanto)}</div>`:''}
    ${req.hacchu_info?`<div class="meta">${esc(req.hacchu_info)}</div>`:''}
    ${req.note?`<div class="meta">備考: ${esc(req.note)}</div>`:''}
    ${norm(req.shanai_bikou)?`<div class="meta">社内備考: ${esc(req.shanai_bikou)}</div>`:''}
    <table><tr><th>品名</th><th>仕様</th><th>数量</th><th>単価</th><th>金額</th><th>発注先</th></tr>${rows}</table>
    <div class="total">合計 ${yen(total)}</div>
  </body></html>`);
  w.document.close();
  w.focus();
  setTimeout(()=>{ try{ w.print(); }catch(e){} }, 300);
}

async function supplierInit(key){
  app.innerHTML='<div class="loading">読み込み中...</div>';
  const r=await apiGet({action:'supplierView',key});
  if(!r.ok){ app.innerHTML=`<div class="card" style="max-width:420px;margin:60px auto;text-align:center;">${esc(r.error)}<br><span class="sub">石川プレートまでお問い合わせください。</span></div>`; return; }
  window._sup={key,...r}; window._ans={};
  if(window._sq===undefined) window._sq='';
  renderSupplier();
}

function SD(){
  const d=window._sup;
  return {
    items: rid => (d.iraiMeisai||[]).filter(m=>norm(m.req_id)===norm(rid)),
    mei:   kid => (d.meisai||[]).filter(m=>norm(m.kaito_id)===norm(kid)),
    qa:    rid => (d.qa||[]).filter(x=>norm(x.req_id)===norm(rid)),
    hac:   rid => (d.hacchu||[]).filter(x=>norm(x.req_id)===norm(rid))
  };
}

function supMatch(r){
  const q=norm(window._sq).toLowerCase();
  if(!q) return true;
  const items=SD().items(r.req_id).map(m=>m.hinmei+' '+m.shiyou).join(' ');
  return (norm(r.title)+' '+items+' '+norm(r.note)+' '+norm(r.req_id)).toLowerCase().includes(q);
}

      <div style="margin-top:10px;border-top:1px solid #dbe2f0;padding-top:10px;">
        <label>納入予定日${yotei?`（登録済: ${esc(yotei)}）`:''}</label>

      </div>
    </div>`;
  }).join('');

    <h2 style="font-size:15px;margin-bottom:10px;">ご回答をお願いする依頼（${openReqs.length}件）</h2>
    ${openReqs.length?'':'<div class="card sub">'+(norm(window._sq)?'該当する依頼はありません。':'現在、ご回答をお願いしている依頼はありません。')+'</div>'}
    <div id="open-reqs"></div>

    ${done.length?'<h2 style="font-size:15px;margin:22px 0 10px;">回答済み</h2>':''}
    ${done.map(r=>{
      const q=d.quotes.find(x=>norm(x.req_id)===norm(r.req_id));

        <td><input type="number" value="${esc(l.qty)}" style="width:62px;" oninput="upExtra('${r.req_id}',${i},'qty',this.value)"></td>
        <td><select onchange="upExtra('${r.req_id}',${i},'unit',this.value)">${UNITS.map(u=>`<option ${u===l.unit?'selected':''}>${u}</option>`).join('')}</select></td>
        <td><input type="number" value="${esc(l.unit_price)}" style="width:92px;" oninput="upExtra('${r.req_id}',${i},'unit_price',this.value)"></td>
        <td><input type="number" value="${esc(l.lead_days||'')}" style="width:64px;" placeholder="日" oninput="upExtra('${r.req_id}',${i},'lead_days',this.value)"></td>
        <td><button class="m-del" onclick="delExtra('${r.req_id}',${i})">×</button></td>
      </tr>`).join('')}
    </table>
    <button class="btn btn-ghost btn-sm" onclick="addExtra('${r.req_id}')">＋ 品目を追加</button>
    <div class="m-total">合計 ${yen(total)}</div>
    <div class="grid2">
      <div><label>見積有効期限</label>
        <select onchange="upMeta('${r.req_id}','valid',this.value)">
          ${VALID_OPTIONS.map(v=>`<option value="${v}" ${v===a.valid?'selected':''}>${v||'指定なし'}</option>`).join('')}
        </select></div>
      <div><label>コメント（任意・複数行OK）</label>
        <textarea rows="3" placeholder="在庫状況、条件など（改行できます）" oninput="upMeta('${r.req_id}','note',this.value)">${esc(a.note)}</textarea></div>
    </div>
    <div style="margin-top:14px;text-align:right;">
      <button class="btn btn-primary" onclick="sendQuote('${esc(r.req_id)}')">この内容で回答する</button>
    </div>
    ${qaBlockSupplier(r.req_id)}`;
}

function refreshTotal(reqId){
  const a=window._ans[reqId];
  const total=[...a.lines,...a.extra].reduce((s,l)=>norm(l.kubun)==='対応不可'?s:s+Number(l.qty||0)*Number(l.unit_price||0),0);
  const el=document.getElementById('req-'+cssEsc(reqId)).querySelector('.m-total');
  if(el) el.textContent='合計 '+yen(total);
}
function upAns(rid,i,f,v){
  window._ans[rid].lines[i][f]=v;
  if(f==='kubun'){
    const r=window._sup.requests.find(x=>norm(x.req_id)===norm(rid));
    renderReqForm(r, SD().items(rid));
    return;
  }
  refreshTotal(rid);
}
function upExtra(rid,i,f,v){ window._ans[rid].extra[i][f]=v; refreshTotal(rid); }
function upMeta(rid,f,v){ window._ans[rid][f]=v; }
function addExtra(rid){
  window._ans[rid].extra.push({item_name:'',qty:1,unit:'式',unit_price:'',lead_days:''});
  const r=window._sup.requests.find(x=>norm(x.req_id)===norm(rid));
  renderReqForm(r, SD().items(rid));
}
function delExtra(rid,i){
  window._ans[rid].extra.splice(i,1);
  const r=window._sup.requests.find(x=>norm(x.req_id)===norm(rid));
  renderReqForm(r, SD().items(rid));
}

async function sendQuote(reqId){
  const a=window._ans[reqId];
  const lines=[
    ...a.lines.filter(l=>norm(l.kubun)==='対応不可'||norm(l.unit_price)!==''),
    ...a.extra.filter(l=>norm(l.unit_price)!=='')
  ];
  if(!lines.length){ toast('単価の入力、または区分の選択をお願いします'); return; }
  const missing=a.lines.filter(l=>norm(l.kubun)!=='対応不可'&&norm(l.unit_price)==='');
  if(missing.length){ toast('単価が未入力の品目があります（出せない場合は区分を「対応不可」にしてください）'); return; }
  if(!confirm('この内容で回答を送信しますか？送信後の修正はできません。')) return;
  const r=await apiPost({action:'submitQuote',key:window._sup.key,req_id:reqId,
    lines, note:a.note, valid_until:a.valid});
  if(!r.ok){ toast('エラー: '+r.error); return; }
  toast('回答を送信しました。ありがとうございました。');
  supplierInit(window._sup.key);
}
</script>
</body>
</html>
